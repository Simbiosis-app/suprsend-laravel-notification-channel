name: PHPUnit tests

on:
  - push
  - pull_request

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: [12, 13]
        dependency-version: [prefer-stable]
        include:
          - php: '8.3'
            laravel: 12
            dependency-version: prefer-lowest
          - php: '8.3'
            laravel: 13
            dependency-version: prefer-lowest
        exclude:
          # Laravel 12 is only maintained through Aug 2026; 8.5 coverage on 13 is enough.
          - php: '8.5'
            laravel: 12

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, libxml, mbstring
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction \
            "illuminate/notifications:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0"
          composer require --dev --no-update --no-interaction \
            "orchestra/testbench:^${{ matrix.laravel == 13 && '11' || '10' }}.0"
          composer update --${{ matrix.dependency-version }} \
            --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/phpunit
